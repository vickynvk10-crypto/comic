<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ComicCraft — AI Comic Creator</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <span class="badge">✨ GEMINI + AI ART</span>
    <h1>ComicCraft</h1>
    <p>Turn one idea into a five-panel comic story with narration, dialogue and illustrations.</p>
  </div>
</header>

<main class="container">
  <section class="card">
    <h2>Create your comic</h2>
    <form method="post" action="/generate">
      <label>Story Prompt
        <textarea name="story_prompt" required placeholder="A brave fox exploring an enchanted forest..."></textarea>
      </label>

      <div class="grid">
        <label>Main Character Name
          <input name="character_name" required placeholder="Arun">
        </label>
        <label>Setting
          <select name="setting">
            <option>enchanted forest</option><option>school</option><option>space station</option>
            <option>futuristic city</option><option>underwater kingdom</option>
          </select>
        </label>
      </div>

      <div class="grid">
        <label>Story Tone
          <select name="tone">
            <option>light-hearted</option><option>dramatic</option><option>poetic</option><option>funny</option>
          </select>
        </label>
        <label>Art Style
          <select name="art_style">
            <option>anime</option><option>comic book</option><option>pixel art</option><option>realistic</option>
          </select>
        </label>
      </div>

      <button type="submit" class="primary">🚀 Generate My Comic</button>
    </form>
  </section>

  <section class="info">
    <div><b>01</b><span>Gemini creates a 5-panel outline.</span></div>
    <div><b>02</b><span>Gemini expands narration and dialogue.</span></div>
    <div><b>03</b><span>AI art is generated for every panel.</span></div>
    <div><b>04</b><span>Everything is assembled into a PDF.</span></div>
  </section>
</main>
</body>
</html>
